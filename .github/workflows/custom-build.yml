name: Custom Windows Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: 'C:/vcpkg'
      VCPKGRS_DYNAMIC: '0'

    steps:
      - name: Checkout Code (inkl. Submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter (mit Dart 3.5+)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Fetch Flutter Dependencies
        run: |
          cd flutter
          flutter pub get

      - name: Install LLVM, Clang & NASM
        run: |
          choco install llvm nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Install vcpkg C-Dependencies
        run: |
          cd C:/vcpkg
          .\vcpkg.exe integrate install
          .\vcpkg.exe install opus:x64-windows-static
          .\vcpkg.exe install libsodium:x64-windows-static
          .\vcpkg.exe install libyuv:x64-windows-static
          .\vcpkg.exe install libvpx:x64-windows-static
          .\vcpkg.exe install aom:x64-windows-static

      - name: Install flutter_rust_bridge_codegen & Generate Bridge
        shell: bash
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --locked
          flutter_rust_bridge_codegen --rust-input src/flutter_ffi.rs --dart-output flutter/lib/generated_bridge.dart

      - name: Build RustDesk Client via build.py
        shell: bash
        env:
          RENDEZVOUS_SERVER: "rustdesk.kracht.io"
          RS_PUB_KEY: "qr+tqoH2qrQWFGBWKsN734UquYLi4exCg+vpnW6xOPY="
        run: |
          python3 build.py --flutter

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows
          path: |
            rustdesk_portable.exe
            rustdesk-*-install.exe