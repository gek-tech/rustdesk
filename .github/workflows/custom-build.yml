name: Custom Windows Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: 'C:/vcpkg'
      VCPKGRS_DYNAMIC: '0'

    steps:
      - name: Checkout Code (inkl. Submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install LLVM, Clang & NASM (Notwendig für AOM/AV1 Codec)
        run: |
          choco install llvm nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Install vcpkg C-Dependencies (Opus, Libsodium, VPX, YUV, AOM)
        run: |
          cd C:/vcpkg
          .\vcpkg.exe integrate install
          .\vcpkg.exe install opus:x64-windows-static
          .\vcpkg.exe install libsodium:x64-windows-static
          .\vcpkg.exe install libyuv:x64-windows-static
          .\vcpkg.exe install libvpx:x64-windows-static
          .\vcpkg.exe install aom:x64-windows-static

      - name: Build RustDesk Client via build.py
        shell: bash
        run: |
          python3 build.py --flutter

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows
          path: |
            target/release/rustdesk.exe
            build/windows/runner/Release/